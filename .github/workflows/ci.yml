name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  build-images:
    needs: [test-frontend, test-backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/todo-app-client:latest
          build-args: |
            VITE_API_URL=http://13.207.171.80

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/todo-app-server:latest
  
  verify-build:
    needs: [test-frontend, test-backend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            VITE_API_URL=http://placeholder

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
      
      - name: Smoke test the built image
        run: |
          docker build -t smoke-test ./server
          docker run -d --name smoke -p 3000:3000 \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=x -e DB_USER=x -e DB_PASSWORD=x \
            smoke-test
          sleep 5
          docker logs smoke
          docker ps --filter name=smoke --filter status=running | grep -q smoke \
            || { echo "Container exited on startup"; exit 1; }

  deploy:
    needs: build-images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ secrets.EC2_PROJECT_PATH }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_PROJECT_PATH }}

            cat > server/.env.docker << 'EOF'
            ${{ secrets.ENV_DOCKER_CONTENTS }}
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d
            docker image prune -f

            echo "=== waiting for containers to settle ==="
            sleep 15

            echo "=== CONTAINER STATUS ==="
            docker compose ps

            echo "=== SERVER LOGS ==="
            docker compose logs server --tail=50

            echo "=== CLIENT LOGS ==="
            docker compose logs client --tail=30

            echo "=== DB LOGS ==="
            docker compose logs db --tail=20

            echo "=== DISK ==="
            df -h /

            echo "=== HEALTH CHECK ==="
            curl -sf http://localhost:3000/api/todos > /dev/null \
              && echo "backend responding" \
              || { echo "BACKEND NOT RESPONDING"; exit 1; }

            RUNNING=$(docker compose ps --status running --format '{{.Service}}' | wc -l)
            if [ "$RUNNING" -lt 3 ]; then
              echo "Only $RUNNING of 3 services running"
              exit 1
            fi
  
  collect-aws-diagnostics:
    needs: deploy
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Pull metrics and logs
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set +e
          START=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%S)
          END=$(date -u +%Y-%m-%dT%H:%M:%S)
          START_MS=$(date -u -d '30 minutes ago' +%s000)

          : > /tmp/aws_diag.txt

          echo "=== INSTANCE STATUS ===" >> /tmp/aws_diag.txt
          aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" \
            --query 'InstanceStatuses[0].[InstanceState.Name,InstanceStatus.Status,SystemStatus.Status]' \
            --output text >> /tmp/aws_diag.txt 2>&1

          echo "=== CPU (30 min) ===" >> /tmp/aws_diag.txt
          aws cloudwatch get-metric-statistics \
            --namespace AWS/EC2 --metric-name CPUUtilization \
            --dimensions Name=InstanceId,Value="$INSTANCE_ID" \
            --start-time "$START" --end-time "$END" --period 300 \
            --statistics Average Maximum --output table >> /tmp/aws_diag.txt 2>&1

          echo "=== MEMORY (30 min) ===" >> /tmp/aws_diag.txt
          aws cloudwatch get-metric-statistics \
            --namespace TodoApp --metric-name MemoryUtilization \
            --dimensions Name=InstanceId,Value="$INSTANCE_ID" \
            --start-time "$START" --end-time "$END" --period 300 \
            --statistics Average Maximum --output table >> /tmp/aws_diag.txt 2>&1

          echo "=== DISK (30 min) ===" >> /tmp/aws_diag.txt
          aws cloudwatch get-metric-statistics \
            --namespace TodoApp --metric-name DiskUtilization \
            --dimensions Name=InstanceId,Value="$INSTANCE_ID" \
            --start-time "$START" --end-time "$END" --period 300 \
            --statistics Average Maximum --output table >> /tmp/aws_diag.txt 2>&1

          echo "=== CONTAINER LOGS ===" >> /tmp/aws_diag.txt
          for stream in server client db; do
            echo "--- $stream ---" >> /tmp/aws_diag.txt
            aws logs get-log-events \
              --log-group-name /todo-app/containers \
              --log-stream-name "$stream" \
              --start-time "$START_MS" --limit 100 \
              --query 'events[*].message' --output text >> /tmp/aws_diag.txt 2>&1
          done

          set -e
          wc -l /tmp/aws_diag.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: aws-diagnostics
          path: /tmp/aws_diag.txt
          retention-days: 7

  explain-failure:
    needs: [test-frontend, test-backend, build-images, deploy, collect-aws-diagnostics]
    if: >
      failure() &&
      !startsWith(github.head_ref, 'claude-fix/') &&
      !startsWith(github.ref_name, 'claude-fix/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch failed job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.conclusion=="failure") | .id' > /tmp/failed_ids.txt

          echo "Failed job IDs:"
          cat /tmp/failed_ids.txt

          : > /tmp/logs.txt
          while read -r id; do
            echo "===== JOB $id =====" >> /tmp/logs.txt
            URL=$(gh api -i "repos/${{ github.repository }}/actions/jobs/$id/logs" 2>/dev/null \
              | grep -i '^location:' | awk '{print $2}' | tr -d '\r')
            if [ -n "$URL" ]; then
              curl -sSL "$URL" >> /tmp/logs.txt
            else
              gh api "repos/${{ github.repository }}/actions/jobs/$id/logs" >> /tmp/logs.txt 2>&1 \
                || echo "(log fetch failed for job $id)" >> /tmp/logs.txt
            fi
          done < /tmp/failed_ids.txt

          tail -n 400 /tmp/logs.txt > /tmp/logs_trimmed.txt

          if [ ! -s /tmp/logs_trimmed.txt ]; then
            echo "No logs retrieved — aborting."
            exit 1
          fi

          wc -l /tmp/logs_trimmed.txt
      
      - name: Download AWS diagnostics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aws-diagnostics
          path: /tmp/aws

      - name: Merge into log context
        run: |
          if [ -f /tmp/aws/aws_diag.txt ]; then
            echo "===== AWS DIAGNOSTICS =====" >> /tmp/logs_trimmed.txt
            cat /tmp/aws/aws_diag.txt >> /tmp/logs_trimmed.txt
          fi

      - name: Summarize with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request

          with open("/tmp/logs_trimmed.txt") as f:
              logs = f.read()[-40000:]

          prompt = f"""These are logs from a failed GitHub Actions run on a Node/React/Postgres app
          (Vite frontend, Express backend, Docker images pushed to GHCR, deployed to EC2).

          Explain in under 200 words:
          1. Which job failed and at what step
          2. The root cause
          3. The specific fix

          Be concrete — name files, commands, or config keys. Skip anything not relevant to the failure.

          Logs:
          {logs}"""

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps({
                  "model": "claude-sonnet-4-6",
                  "max_tokens": 1000,
                  "messages": [{"role": "user", "content": prompt}],
              }).encode(),
              headers={
                  "content-type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
              },
          )

          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          text = "".join(b.get("text", "") for b in data["content"])
          with open("summary.md", "w") as f:
              f.write(text)
          print(text)
          PY

      - name: Post summary to job output
        run: |
          {
            echo "## 🔍 AI Failure Summary"
            echo
            cat summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue with the summary
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          {
            cat summary.md
            printf '\n'
            printf '[View run](%s)\n' "$RUN_URL"
          } > issue_body.md

          gh issue create --title "CI failed on $SHA" --body-file issue_body.md