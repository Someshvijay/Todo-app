name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  build-images:
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/todo-app-client:latest
          build-args: |
            VITE_API_URL=http://13.207.171.80

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/todo-app-server:latest

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ secrets.EC2_PROJECT_PATH }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_PROJECT_PATH }}

            cat > server/.env.docker << 'EOF'
            ${{ secrets.ENV_DOCKER_CONTENTS }}
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d
            docker image prune -f

  explain-failure:
    needs: [test-frontend, test-backend, build-images, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch failed job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.conclusion=="failure") | .id' > failed_ids.txt

          : > logs.txt
          while read -r id; do
            echo "===== JOB $id =====" >> logs.txt
            gh api "repos/${{ github.repository }}/actions/jobs/$id/logs" >> logs.txt 2>/dev/null || true
          done < failed_ids.txt

          # keep the last 400 lines — errors are almost always at the end
          tail -n 400 logs.txt > logs_trimmed.txt
          wc -l logs_trimmed.txt

      - name: Summarize with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request

          with open("logs_trimmed.txt") as f:
              logs = f.read()[-40000:]

          prompt = f"""These are logs from a failed GitHub Actions run on a Node/React/Postgres app
          (Vite frontend, Express backend, Docker images pushed to GHCR, deployed to EC2).

          Explain in under 200 words:
          1. Which job failed and at what step
          2. The root cause
          3. The specific fix

          Be concrete — name files, commands, or config keys. Skip anything not relevant to the failure.

          Logs:
          {logs}"""

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps({
                  "model": "claude-sonnet-4-6",
                  "max_tokens": 1000,
                  "messages": [{"role": "user", "content": prompt}],
              }).encode(),
              headers={
                  "content-type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
              },
          )

          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          text = "".join(b.get("text", "") for b in data["content"])
          with open("summary.md", "w") as f:
              f.write(text)
          print(text)
          PY

      - name: Post summary to job output
        run: |
          {
            echo "## 🔍 AI Failure Summary"
            echo
            cat summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue with the summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "CI failed on ${{ github.sha }}" \
            --body "$(cat summary.md)

          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"