name: Cleanup AI Branches

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    if: startsWith(github.event.pull_request.head.ref, 'claude-fix/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" && \
            echo "Deleted $BRANCH" || echo "Already gone"